name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required files
        run: |
          test -f src/index.html
          test -f src/styles/style.css
          test -f src/scripts/app.js
          test -f package.json

      - name: Run tests
        run: npm test

      - name: CI completed
        run: echo "CI workflow completed successfully"