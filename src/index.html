<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TaskFlow — Organize your day, achieve your goals. A smart daily task manager built with HTML, CSS and JavaScript."
    >

    <title>TaskFlow — Smart Daily Task Manager</title>

    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                </div>
                <div class="header-title-group">
                    <h1>TaskFlow <span class="sparkle">&#10022;</span></h1>
                    <p>Organize your day, achieve your goals</p>
                </div>
            </div>
            <div class="header-right">
                <button class="notification-btn" id="notificationBtn" type="button" aria-label="Enable browser notifications" title="Enable Notifications">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span id="notificationBtnText">Notifications</span>
                </button>
                <div class="header-date" id="currentDate"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">

            <!-- Statistics Cards -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-blue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Total</span>
                        <span class="stat-value" id="taskCount">0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon stat-icon-orange">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Active</span>
                        <span class="stat-value" id="activeCount">0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon stat-icon-green">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Done</span>
                        <span class="stat-value" id="completedCount">0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon stat-icon-purple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="6"></circle>
                            <circle cx="12" cy="12" r="2"></circle>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-label">Progress</span>
                        <span class="stat-value" id="progressPercent">0%</span>
                    </div>
                </div>
            </section>

            <!-- Summary Bar -->
            <section class="stats-summary" id="statsSummary">
                <span class="summary-item summary-today">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Due Today: <strong id="dueTodayCount">0</strong>
                </span>
                <span class="summary-item summary-overdue">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    Overdue: <strong id="overdueCount">0</strong>
                </span>
            </section>

            <!-- Task Manager Card -->
            <section class="task-manager-card">

                <!-- Task Input Form -->
                <div class="task-form" id="taskForm">
                    <div class="task-form-row task-form-title-row">
                        <input
                            type="text"
                            id="taskInput"
                            placeholder="What needs to be done?"
                            aria-label="Task title"
                        >
                        <button id="addTaskButton" type="button">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add Task
                        </button>
                    </div>

                    <div class="task-form-row task-form-fields">
                        <div class="form-group">
                            <label for="taskDueDate">Due Date</label>
                            <input type="date" id="taskDueDate" aria-label="Due date">
                        </div>
                        <div class="form-group">
                            <label for="taskDueTime">Due Time</label>
                            <input type="time" id="taskDueTime" aria-label="Due time">
                        </div>
                        <div class="form-group">
                            <label for="taskPriority">Priority</label>
                            <select id="taskPriority" aria-label="Task priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="taskReminder">Reminder</label>
                            <select id="taskReminder" aria-label="Task reminder">
                                <option value="none">No reminder</option>
                                <option value="at-time">At due time</option>
                                <option value="5-min">5 minutes before</option>
                                <option value="15-min">15 minutes before</option>
                                <option value="30-min">30 minutes before</option>
                                <option value="1-hour">1 hour before</option>
                                <option value="1-day">1 day before</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-validation" id="formValidation"></div>
                </div>

                <!-- Toolbar: Filters + Sort -->
                <div class="filter-section">
                    <div class="filter-row">
                        <span class="filter-icon">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                            </svg>
                        </span>
                        <div class="filters">
                            <button data-filter="all" class="filter-active">All</button>
                            <button data-filter="active">Active</button>
                            <button data-filter="completed">Completed</button>
                            <button data-filter="today">Today</button>
                            <button data-filter="overdue">Overdue</button>
                        </div>
                        <div class="sort-control">
                            <label for="sortSelect" class="sr-only">Sort by</label>
                            <select id="sortSelect" aria-label="Sort tasks">
                                <option value="created">Date Created</option>
                                <option value="due">Due Date</option>
                                <option value="priority">Priority</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Task List -->
                <ul id="taskList"></ul>

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                            <path d="M9 14l2 2 4-4"></path>
                        </svg>
                    </div>
                    <h3>No tasks yet</h3>
                    <p>Your task list is empty. Add your first task to get started!</p>
                </div>
            </section>

        </div>
    </main>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModalOverlay">
        <div class="modal" role="dialog" aria-labelledby="editModalTitle" aria-modal="true">
            <div class="modal-header">
                <h2 id="editModalTitle">Edit Task</h2>
                <button class="modal-close-btn" id="editModalClose" type="button" aria-label="Close edit dialog">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editTaskTitle">Task Title</label>
                    <input type="text" id="editTaskTitle" aria-label="Edit task title">
                </div>
                <div class="modal-form-row">
                    <div class="form-group">
                        <label for="editDueDate">Due Date</label>
                        <input type="date" id="editDueDate" aria-label="Edit due date">
                    </div>
                    <div class="form-group">
                        <label for="editDueTime">Due Time</label>
                        <input type="time" id="editDueTime" aria-label="Edit due time">
                    </div>
                </div>
                <div class="modal-form-row">
                    <div class="form-group">
                        <label for="editPriority">Priority</label>
                        <select id="editPriority" aria-label="Edit priority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="editReminder">Reminder</label>
                        <select id="editReminder" aria-label="Edit reminder">
                            <option value="none">No reminder</option>
                            <option value="at-time">At due time</option>
                            <option value="5-min">5 minutes before</option>
                            <option value="15-min">15 minutes before</option>
                            <option value="30-min">30 minutes before</option>
                            <option value="1-hour">1 hour before</option>
                            <option value="1-day">1 day before</option>
                        </select>
                    </div>
                </div>
                <div class="form-validation" id="editFormValidation"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-cancel-btn" id="editModalCancel" type="button">Cancel</button>
                <button class="modal-save-btn" id="editModalSave" type="button">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <p>Built with &#10084;&#65039; using HTML, CSS &amp; JavaScript</p>
        <p>TaskFlow &copy; 2026</p>
    </footer>

    <script src="scripts/app.js"></script>
</body>
</html>
